name: CI

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: macOS build and checks
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/clang-module-cache
      SWIFTPM_MODULECACHE_OVERRIDE: ${{ github.workspace }}/.build/swift-module-cache
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: '3.12'
      - name: Report toolchain
        run: |
          sw_vers
          swift --version
          python3 --version
      - name: Check release version and tag
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          base = Path("VERSION").read_text().strip()
          release = Path("REL_VERSION").read_text().strip()
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", base), "Invalid VERSION"
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-preview\.[1-9][0-9]*)?", release), "Invalid REL_VERSION"
          assert release.split("-")[0] == base, "Release and app versions differ"
          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/"):
              assert ref == "refs/tags/v" + release, "Tag and source release version differ"
          print("App:", base, "Release:", release)
          PY
      - name: Build Swift targets
        run: swift build --disable-sandbox --scratch-path "$PWD/.build" --cache-path "$PWD/.build/cache"
      - name: Run core checks
        run: bash scripts/test.sh
      - name: Run application state checks
        run: bash scripts/test-app-state.sh
      - name: Run agent skill checks
        run: python3 -B -m unittest discover -s Tests/AgentSkills -v
      # These checks do not automate native UI acceptance or release an app.
      # Do not upload private evidence, workspaces, or raw session logs.
